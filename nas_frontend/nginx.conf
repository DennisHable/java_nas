events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # zobrazení/předání React frontendu
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html; # pro budoucí URL adresy v Reactu (SPA fallback)
        }

        # přesměrování API požadavků do Spring Boot backendu
        location /api {
            proxy_pass http://nas-backend:8080; # 'nas-backend' je název služby v docker-compose
            # kvůli JSESSIONID musíme nastavit, aby nginx informoval Spring, že se jedná o uživatele (jinak by vše šlo jen z vnitřní adresy nginx kontejneru)  
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # konfigurace pro streamování gigabajtových souborů bez přerušení
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 10G; # maximální povolená velikost uploadu v Nginx
        }
    }
}
