# Konfigurace pro H2; b??í pouze v RAM; b?hem test?
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# dialekt pro Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# p?i startu testu se vytvo?í nové schéma z entit, po skon?ení test? se kompletn? sma?e
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# vynutíme stejná nastavení pro cookies jako v aplikaci
server.servlet.session.cookie.same-site=strict

